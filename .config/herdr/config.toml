onboarding = false
[theme]
name = "tokyo-night"

auto_switch = false
[keys]
detach = ["prefix+q", "prefix+d"]
split_horizontal = ["prefix+minus", "prefix+shift+h"]
zoom = ["prefix+z", "prefix+space"]
next_tab = ["prefix+n", "prefix+l"]
previous_tab = ["prefix+p", "prefix+h"]
last_pane = "ctrl+backslash"
settings = "prefix+shift+s"
reload_config = ["prefix+r", "prefix+shift+r"]
resize_mode = "prefix+alt+r"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "sessionizer.open"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "alejandromalavet.open-hints.open"

[[keys.command]]
key = "prefix+up"
type = "shell"
command = "herdr pane resize --direction up --amount 0.05"

[[keys.command]]
key = "prefix+down"
type = "shell"
command = "herdr pane resize --direction down --amount 0.05"

[[keys.command]]
key = "prefix+left"
type = "shell"
command = "herdr pane resize --direction left --amount 0.1"

[[keys.command]]
key = "prefix+right"
type = "shell"
command = "herdr pane resize --direction right --amount 0.1"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "willfish.herdr-navigator.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "willfish.herdr-navigator.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "willfish.herdr-navigator.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "willfish.herdr-navigator.right"

[[keys.command]]
key = "prefix+0"
type = "shell"
command = "herdr tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID | jq -r '.result.tabs[0].tab_id' | xargs herdr tab focus"

[[keys.command]]
key = "prefix+1"
type = "shell"
command = "herdr tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID | jq -r '.result.tabs[1].tab_id' | xargs herdr tab focus"

