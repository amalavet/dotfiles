[general]
import = ["~/.config/alacritty/os.toml"]

[mouse]
hide_when_typing = true

[[hints.enabled]]
regex = '''https?://[^\s<>"'`)\]│┃▕▏]+'''
command = { program = "sh", args = ["-c", 'exec "$HOME/.config/herdr/plugin-open-hints/open-hints.py" "$1"', "open-hints"] }
mouse = { enabled = true, mods = "None" }

[[hints.enabled]]
regex = '(~|\.\.?)?/?[\w.@+%-]+(/[\w.@+%-]+)+(:\d+(:\d+)?)?|[\w@+-]+\.[A-Za-z]\w*(:\d+(:\d+)?)?'
command = { program = "sh", args = ["-c", 'exec "$HOME/.config/herdr/plugin-open-hints/open-hints.py" "$1"', "open-hints"] }
mouse = { enabled = true, mods = "None" }

[window]
decorations = "none"
option_as_alt = "Both"

[font]
# normal.family = "Maple Mono NF"
# normal.family = "Iosevka Nerd Font"
normal.family = "JetBrainsMono Nerd Font"

[colors]
transparent_background_colors = true

# TokyoNight Alacritty Colors
[colors.primary]
background = '#1a1b26'
foreground = '#c0caf5'

[colors.normal]
black = '#15161e'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#a9b1d6'

[colors.bright]
black = '#414868'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#c0caf5'

[[colors.indexed_colors]]
index = 16
color = '#ff9e64'

[[colors.indexed_colors]]
index = 17
color = '#db4b4b'
